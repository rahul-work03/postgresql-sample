version: '3.9'

services:
  db:
    image: postgres:16
    container_name: flask-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: flask-web
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  pgdata:
